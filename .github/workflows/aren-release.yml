name: aren-release

on:
  push:
    tags:
      - "aren-v*"
  workflow_dispatch:

concurrency:
  group: aren-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AREN_ARCHIVE: aren-linux-x86_64.tar.gz
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # The upstream release profile uses Thin-LTO and needs substantially more
  # memory than a standard GitHub-hosted runner. Aren keeps release
  # optimization while using a less memory-intensive linker configuration.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_DEBUG: "none"
  CARGO_PROFILE_RELEASE_STRIP: "symbols"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_BUILD_JOBS: "2"

jobs:
  build-linux-x86_64:
    name: Build Aren for Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils \
            libcap-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Configure pinned rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Build Aren
        run: cargo build --locked --release -p codex-cli --bin codex

      - name: Package and smoke-test Aren
        run: |
          set -euo pipefail
          mkdir -p ../dist/package
          install -m 0755 target/release/codex ../dist/package/aren
          install -m 0755 target/release/codex ../dist/aren-linux-x86_64

          if [[ "${GITHUB_REF}" == refs/tags/aren-v* ]]; then
            release_name="${GITHUB_REF_NAME}"
          else
            release_name="aren-manual-${GITHUB_SHA:0:12}"
          fi
          printf '%s\n' \
            "release=${release_name}" \
            "commit=${GITHUB_SHA}" \
            "github_run=${GITHUB_RUN_ID}" \
            "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "target=x86_64-unknown-linux-gnu" \
            > ../dist/package/BUILD-INFO.txt
          cp ../dist/package/BUILD-INFO.txt ../dist/BUILD-INFO.txt

          ../dist/package/aren --version
          ../dist/package/aren interactive-search --help >/dev/null
          tar -C ../dist/package -czf "../dist/${AREN_ARCHIVE}" aren BUILD-INFO.txt
          (cd ../dist && sha256sum "${AREN_ARCHIVE}" > "${AREN_ARCHIVE}.sha256")

      - name: Upload build artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: aren-linux-x86_64
          path: |
            dist/${{ env.AREN_ARCHIVE }}
            dist/${{ env.AREN_ARCHIVE }}.sha256
            dist/aren-linux-x86_64
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish Aren GitHub Release
    needs: build-linux-x86_64
    if: startsWith(github.ref, 'refs/tags/aren-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aren-linux-x86_64
          path: dist

      - name: Verify release payload
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum --check "${AREN_ARCHIVE}.sha256"
          )
          mkdir -p dist/verify
          tar -C dist/verify -xzf "dist/${AREN_ARCHIVE}"
          dist/verify/aren --version
          dist/verify/aren interactive-search --help >/dev/null
          grep -Fx "release=${GITHUB_REF_NAME}" dist/verify/BUILD-INFO.txt
          grep -Fx "commit=${GITHUB_SHA}" dist/verify/BUILD-INFO.txt

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Aren ${GITHUB_REF_NAME#aren-v}" \
            --generate-notes \
            "dist/${AREN_ARCHIVE}" \
            "dist/${AREN_ARCHIVE}.sha256" \
            "dist/aren-linux-x86_64" \
            "dist/BUILD-INFO.txt"
