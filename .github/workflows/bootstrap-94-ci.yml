name: bootstrap-94-ci

on:
  push:
    branches:
      - validation/94-ci-bootstrap

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch canonical blocking CI on PR #96 exact head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run blocking-ci.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "chat1/94-autonomous-train-controller"
