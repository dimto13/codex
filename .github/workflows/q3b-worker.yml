name: q3b-worker
on:
  push:
    branches: [feature/queue-existing-session-runtime]
permissions:
  contents: write
  pull-requests: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Q3b integration points
        shell: bash
        run: |
          set -euo pipefail
          echo '=== turn request processor ==='
          rg -n "turn_start|TurnStart|submit_user_input_with_client_user_message_id|thread_manager|get_thread" codex-rs/app-server/src/request_processors/turn.rs codex-rs/app-server/src/request_processors 2>/dev/null | head -n 240 || true
          echo '=== v2 protocol ==='
          rg -n "TurnStart|Thread.*Status|ClientRequest|thread/|turn/" codex-rs/app-server-protocol/src/protocol/{common,v2}.rs | head -n 260 || true
          echo '=== state handle/runtime ==='
          rg -n "StateDbHandle|StateRuntime|enqueue_user_submission|queued_user_submissions|delete_queued" codex-rs/app-server codex-rs/core codex-rs/state | head -n 260 || true
          echo '=== thread manager lookup ==='
          rg -n "get_thread|thread_id|resume_thread|loaded" codex-rs/core/src/thread_manager.rs | head -n 240 || true
          exit 1