name: q3b-worker
on:
  push:
    branches: [feature/queue-existing-session-runtime]
permissions:
  contents: write
  pull-requests: write
jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[q3b-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Implement queue/status slice
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'marker not found in {path}: {old[:80]}')
              p.write_text(s.replace(old,new,1))

          # v2 protocol types
          p=Path('codex-rs/app-server-protocol/src/protocol/v2/thread.rs')
          s=p.read_text()
          marker='#[derive(Serialize, Deserialize, Debug, Clone, PartialEq, JsonSchema, TS)]\n#[serde(rename_all = "camelCase")]\n#[ts(export_to = "v2/")]\npub struct ThreadUnarchiveResponse {'
          block='''#[derive(Serialize, Deserialize, Debug, Clone, PartialEq, Eq, JsonSchema, TS)]
          #[serde(rename_all = "camelCase")]
          #[ts(export_to = "v2/")]
          pub struct ThreadQueueParams {
              pub thread_id: String,
              pub message: String,
              #[ts(optional = nullable)]
              pub client_user_message_id: Option<String>,
          }

          #[derive(Serialize, Deserialize, Debug, Clone, PartialEq, Eq, JsonSchema, TS)]
          #[serde(rename_all = "camelCase")]
          #[ts(export_to = "v2/")]
          pub struct ThreadQueueResponse {
              pub thread_id: String,
              pub queue_id: String,
          }

          #[derive(Serialize, Deserialize, Debug, Clone, Copy, PartialEq, Eq, JsonSchema, TS)]
          #[serde(rename_all = "SCREAMING_SNAKE_CASE")]
          #[ts(rename_all = "SCREAMING_SNAKE_CASE", export_to = "v2/")]
          pub enum ThreadRuntimeState {
              Idle,
              Running,
              Queued,
              NotFound,
          }

          #[derive(Serialize, Deserialize, Debug, Clone, PartialEq, Eq, JsonSchema, TS)]
          #[serde(rename_all = "camelCase")]
          #[ts(export_to = "v2/")]
          pub struct ThreadStatusGetParams {
              pub thread_id: String,
          }

          #[derive(Serialize, Deserialize, Debug, Clone, PartialEq, Eq, JsonSchema, TS)]
          #[serde(rename_all = "camelCase")]
          #[ts(export_to = "v2/")]
          pub struct ThreadStatusGetResponse {
              pub thread_id: String,
              pub state: ThreadRuntimeState,
              pub active_turn: bool,
              pub queued: u32,
          }

          '''+marker
          if 'pub struct ThreadQueueParams' not in s:
              s=s.replace(marker,block,1)
              p.write_text(s)

          # request definitions
          p=Path('codex-rs/app-server-protocol/src/protocol/common.rs'); s=p.read_text()
          marker='''    /// Append raw Responses API items to the thread history without starting a user turn.\n    ThreadInjectItems => "thread/inject_items" {'''
          block='''    ThreadQueue => "thread/queue" {
              params: v2::ThreadQueueParams,
              serialization: thread_id(params.thread_id),
              response: v2::ThreadQueueResponse,
          },
          ThreadStatusGet => "thread/status/get" {
              params: v2::ThreadStatusGetParams,
              serialization: thread_id(params.thread_id),
              response: v2::ThreadStatusGetResponse,
          },
          '''+marker
          if 'ThreadQueue => "thread/queue"' not in s:
              s=s.replace(marker,block,1); p.write_text(s)

          # TurnRequestProcessor state db field and ctor
          p=Path('codex-rs/app-server/src/request_processors/turn_processor.rs'); s=p.read_text()
          if 'state_db: Option<StateDbHandle>,' not in s.split('struct ThreadSettingsBuildParams')[0]:
              s=s.replace('    skills_watcher: Arc<SkillsWatcher>,\n}', '    skills_watcher: Arc<SkillsWatcher>,\n    state_db: Option<StateDbHandle>,\n}',1)
              s=s.replace('        skills_watcher: Arc<SkillsWatcher>,\n    ) -> Self {', '        skills_watcher: Arc<SkillsWatcher>,\n        state_db: Option<StateDbHandle>,\n    ) -> Self {',1)
              s=s.replace('            skills_watcher,\n        }', '            skills_watcher,\n            state_db,\n        }',1)
          method_marker='''    pub(crate) async fn thread_inject_items(\n        &self,\n        params: ThreadInjectItemsParams,'''
          methods='''    pub(crate) async fn thread_queue(
              &self,
              params: ThreadQueueParams,
          ) -> Result<Option<ClientResponsePayload>, JSONRPCErrorError> {
              let thread_id = ThreadId::from_string(&params.thread_id)
                  .map_err(|err| invalid_request(format!("invalid thread id: {err}")))?;
              let thread = self
                  .thread_manager
                  .get_thread(thread_id)
                  .await
                  .map_err(|_| invalid_request(format!("thread not found: {thread_id}")))?;
              let state_db = self
                  .state_db
                  .clone()
                  .ok_or_else(|| internal_error("thread queue requires state database".to_string()))?;
              let payload = serde_json::json!({
                  "message": params.message,
                  "clientUserMessageId": params.client_user_message_id,
              });
              let record = state_db
                  .enqueue_user_submission(thread_id, &payload.to_string())
                  .await
                  .map_err(|err| internal_error(format!("failed to persist queued turn: {err}")))?;
              let queue_id = record.id.clone();
              let message = payload["message"].as_str().unwrap_or_default().to_string();
              let client_user_message_id = payload["clientUserMessageId"]
                  .as_str()
                  .map(str::to_string);
              tokio::spawn(async move {
                  loop {
                      let Ok(queued) = state_db.queued_user_submissions(thread_id).await else {
                          return;
                      };
                      if queued.first().map(|item| item.id.as_str()) != Some(queue_id.as_str()) {
                          tokio::time::sleep(std::time::Duration::from_millis(50)).await;
                          continue;
                      }
                      if matches!(
                          thread.agent_status().await,
                          codex_protocol::protocol::AgentStatus::Running
                      ) {
                          tokio::time::sleep(std::time::Duration::from_millis(50)).await;
                          continue;
                      }
                      let op = Op::UserInput {
                          items: vec![CoreInputItem::Text {
                              text: message.clone(),
                              text_elements: Vec::new(),
                          }],
                          final_output_json_schema: None,
                          responsesapi_client_metadata: None,
                          additional_context: BTreeMap::new(),
                          thread_settings: Default::default(),
                      };
                      if thread
                          .submit_user_input_with_client_user_message_id(
                              op,
                              /*trace*/ None,
                              client_user_message_id.clone(),
                          )
                          .await
                          .is_ok()
                      {
                          let _ = state_db
                              .delete_queued_user_submission(thread_id, &queue_id)
                              .await;
                      }
                      return;
                  }
              });
              Ok(Some(
                  ThreadQueueResponse {
                      thread_id: thread_id.to_string(),
                      queue_id: record.id,
                  }
                  .into(),
              ))
          }

          pub(crate) async fn thread_status_get(
              &self,
              params: ThreadStatusGetParams,
          ) -> Result<Option<ClientResponsePayload>, JSONRPCErrorError> {
              let thread_id = match ThreadId::from_string(&params.thread_id) {
                  Ok(thread_id) => thread_id,
                  Err(_) => {
                      return Ok(Some(
                          ThreadStatusGetResponse {
                              thread_id: params.thread_id,
                              state: ThreadRuntimeState::NotFound,
                              active_turn: false,
                              queued: 0,
                          }
                          .into(),
                      ));
                  }
              };
              let Ok(thread) = self.thread_manager.get_thread(thread_id).await else {
                  return Ok(Some(
                      ThreadStatusGetResponse {
                          thread_id: thread_id.to_string(),
                          state: ThreadRuntimeState::NotFound,
                          active_turn: false,
                          queued: 0,
                      }
                      .into(),
                  ));
              };
              let active_turn = matches!(
                  thread.agent_status().await,
                  codex_protocol::protocol::AgentStatus::Running
              );
              let queued = match self.state_db.as_ref() {
                  Some(state_db) => state_db
                      .queued_user_submissions(thread_id)
                      .await
                      .map_err(|err| internal_error(format!("failed to read queued turns: {err}")))?
                      .len() as u32,
                  None => 0,
              };
              let state = if active_turn {
                  ThreadRuntimeState::Running
              } else if queued > 0 {
                  ThreadRuntimeState::Queued
              } else {
                  ThreadRuntimeState::Idle
              };
              Ok(Some(
                  ThreadStatusGetResponse {
                      thread_id: thread_id.to_string(),
                      state,
                      active_turn,
                      queued,
                  }
                  .into(),
              ))
          }

          '''+method_marker
          if 'pub(crate) async fn thread_queue(' not in s:
              if method_marker not in s: raise SystemExit('turn processor method marker missing')
              s=s.replace(method_marker,methods,1)
          p.write_text(s)

          # wire state db into processor
          p=Path('codex-rs/app-server/src/message_processor.rs'); s=p.read_text()
          old='''            Arc::clone(&skills_watcher),\n        );\n        if matches!(plugin_startup_tasks, crate::PluginStartupTasks::Start) {'''
          new='''            Arc::clone(&skills_watcher),\n            state_db.clone(),\n        );\n        if matches!(plugin_startup_tasks, crate::PluginStartupTasks::Start) {'''
          if old in s: s=s.replace(old,new,1)
          match_marker='''            ClientRequest::ThreadInjectItems { params, .. } => {\n                self.turn_processor.thread_inject_items(params).await\n            }'''
          match_block='''            ClientRequest::ThreadQueue { params, .. } => {
              self.turn_processor.thread_queue(params).await
          }
          ClientRequest::ThreadStatusGet { params, .. } => {
              self.turn_processor.thread_status_get(params).await
          }
          '''+match_marker
          if 'ClientRequest::ThreadQueue { params, .. }' not in s:
              if match_marker not in s: raise SystemExit('message processor marker missing')
              s=s.replace(match_marker,match_block,1)
          p.write_text(s)
          PY

          cd codex-rs
          cargo fmt --all
          cargo test -p codex-app-server-protocol --lib
          cargo check -p codex-app-server
          cd ..
          git status --short
          git config user.name dimto13
          git config user.email '93082815+dimto13@users.noreply.github.com'
          git add codex-rs/app-server-protocol/src/protocol/common.rs codex-rs/app-server-protocol/src/protocol/v2/thread.rs codex-rs/app-server/src/message_processor.rs codex-rs/app-server/src/request_processors/turn_processor.rs
          git commit -m 'feat(#28): add durable queue and runtime status API [q3b-generated]'
          git push origin HEAD:feature/queue-existing-session-runtime