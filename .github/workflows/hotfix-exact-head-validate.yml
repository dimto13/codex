name: hotfix-exact-head-validate

on:
  push:
    branches:
      - validate/full-ci-hotfix-90

permissions:
  contents: read

jobs:
  exact-head:
    name: Exact-head build, core tests, clippy
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 76725b738b5e26d3e746bf72f3b65ead06e120dd
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: clippy
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "76725b738b5e26d3e746bf72f3b65ead06e120dd"
      - name: Build codex-core
        run: cargo build -p codex-core
      - name: Test codex-core
        run: just test -p codex-core
      - name: Clippy codex-core
        run: cargo clippy -p codex-core --tests -- -D warnings
