name: aren-ci

# Aren keeps a small GitHub-hosted feedback loop. Only checks that already run
# reliably in this fork belong here.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  format:
    name: Format and benchmark smoke test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Run Rust benchmark smoke test
        run: just bench-smoke
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  cargo-shear:
    name: Cargo dependency hygiene
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-shear@1.11.2
      - name: Check unused dependencies
        run: cargo shear --deny-warnings
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  u1-dependency-lock-generator:
    name: U1 dependency lock generator
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/cargo-deny-security-baseline'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: u1-dependency-lock-generator
      - name: Apply targeted Cargo security updates
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p h2@0.4.13 --precise 0.4.16
          cargo update -p webbrowser@1.0.6 --precise 1.2.2
      - name: Regenerate Bazel lock state
        shell: bash
        run: just bazel-lock-update
      - name: Verify generator scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(codex-rs/Cargo.lock|MODULE.bazel.lock)$' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Generator changed files outside U1 lock scope:" >&2
            echo "${unexpected}" >&2
            exit 1
          fi
          git diff --stat
      - name: Upload generated U1 lockfiles
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: u1-generated-lockfiles-${{ github.event.pull_request.head.sha }}
          path: |
            codex-rs/Cargo.lock
            MODULE.bazel.lock
          if-no-files-found: error
          retention-days: 1
