name: q3c-generator
on:
  push:
    branches: [feature/queue-existing-session-cli]
    paths: [.github/workflows/q3c-generator.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/queue-existing-session-cli
      - name: Implement Q3c
        shell: bash
        run: |
          set -euo pipefail
          cat > codex-rs/app-server-daemon/src/session_control_client.rs <<'RS'
          use std::path::Path;

          use anyhow::Context;
          use anyhow::Result;
          use anyhow::anyhow;
          use codex_app_server_protocol::JSONRPCMessage;
          use codex_app_server_protocol::JSONRPCNotification;
          use codex_app_server_protocol::JSONRPCRequest;
          use codex_app_server_protocol::RequestId;
          use codex_app_server_protocol::ThreadQueueParams;
          use codex_app_server_protocol::ThreadQueueResponse;
          use codex_app_server_protocol::ThreadStatusGetParams;
          use codex_app_server_protocol::ThreadStatusGetResponse;
          use serde::Serialize;
          use serde::de::DeserializeOwned;
          use tokio::time::timeout;

          use crate::client;

          const SESSION_CONTROL_REQUEST_ID: RequestId = RequestId::Integer(2);

          pub(crate) async fn queue(
              socket_path: &Path,
              params: ThreadQueueParams,
          ) -> Result<ThreadQueueResponse> {
              request(socket_path, "thread/queue", params).await
          }

          pub(crate) async fn status(
              socket_path: &Path,
              params: ThreadStatusGetParams,
          ) -> Result<ThreadStatusGetResponse> {
              request(socket_path, "thread/status/get", params).await
          }

          async fn request<P, R>(socket_path: &Path, method: &str, params: P) -> Result<R>
          where
              P: Serialize,
              R: DeserializeOwned,
          {
              let mut websocket = client::connect(socket_path).await?;
              client::initialize(&mut websocket, true).await?;
              client::send_message(
                  &mut websocket,
                  &JSONRPCMessage::Notification(JSONRPCNotification {
                      method: "initialized".to_string(),
                      params: None,
                  }),
              )
              .await
              .context("failed to send initialized notification")?;
              client::send_message(
                  &mut websocket,
                  &JSONRPCMessage::Request(JSONRPCRequest {
                      id: SESSION_CONTROL_REQUEST_ID.clone(),
                      method: method.to_string(),
                      params: Some(serde_json::to_value(params)?),
                      trace: None,
                  }),
              )
              .await
              .with_context(|| format!("failed to send {method} request"))?;

              loop {
                  let message = timeout(
                      client::CONTROL_SOCKET_RESPONSE_TIMEOUT,
                      client::read_message(&mut websocket),
                  )
                  .await
                  .with_context(|| format!("timed out waiting for {method} response"))??;
                  match message {
                      JSONRPCMessage::Response(response)
                          if response.id == SESSION_CONTROL_REQUEST_ID =>
                      {
                          let result = serde_json::from_value(response.result)
                              .with_context(|| format!("failed to parse {method} response"))?;
                          websocket.close(None).await.ok();
                          return Ok(result);
                      }
                      JSONRPCMessage::Error(error) if error.id == SESSION_CONTROL_REQUEST_ID => {
                          websocket.close(None).await.ok();
                          return Err(anyhow!("{method} failed: {}", error.error.message));
                      }
                      _ => {}
                  }
              }
          }
          RS

          python3 - <<'PY'
          from pathlib import Path

          p = Path('codex-rs/app-server-daemon/src/lib.rs')
          s = p.read_text()
          old = 'mod remote_control_client;\nmod settings;'
          new = 'mod remote_control_client;\nmod session_control_client;\nmod settings;'
          assert old in s
          s = s.replace(old, new, 1)
          old = 'use codex_app_server_protocol::RemoteControlPairingStartResponse;\n'
          new = old + 'use codex_app_server_protocol::ThreadQueueParams;\nuse codex_app_server_protocol::ThreadQueueResponse;\nuse codex_app_server_protocol::ThreadStatusGetParams;\nuse codex_app_server_protocol::ThreadStatusGetResponse;\n'
          assert old in s
          s = s.replace(old, new, 1)
          marker = 'pub async fn probe_app_server_version(socket_path: &Path) -> Result<String> {\n    Ok(client::probe(socket_path).await?.app_server_version)\n}\n'
          insert = marker + '\n/// Queues one user turn into an existing Aren session through the daemon control socket.\npub async fn queue_existing_session(params: ThreadQueueParams) -> Result<ThreadQueueResponse> {\n    ensure_supported_platform()?;\n    let daemon = Daemon::from_environment()?;\n    session_control_client::queue(&daemon.socket_path, params).await\n}\n\n/// Returns the current runtime status for an existing Aren session.\npub async fn existing_session_status(\n    params: ThreadStatusGetParams,\n) -> Result<ThreadStatusGetResponse> {\n    ensure_supported_platform()?;\n    let daemon = Daemon::from_environment()?;\n    session_control_client::status(&daemon.socket_path, params).await\n}\n'
          assert marker in s
          s = s.replace(marker, insert, 1)
          p.write_text(s)

          p = Path('codex-rs/cli/src/remote_control_cmd.rs')
          s = p.read_text()
          old = 'use codex_app_server_protocol::RemoteControlPairingStartResponse;\n'
          new = old + 'use codex_app_server_protocol::ThreadQueueParams;\nuse codex_app_server_protocol::ThreadRuntimeState;\nuse codex_app_server_protocol::ThreadStatusGetParams;\n'
          assert old in s
          s = s.replace(old, new, 1)
          old = '            Some(RemoteControlSubcommand::Pair) => "remote-control pair",\n'
          new = old + '            Some(RemoteControlSubcommand::Queue { .. }) => "remote-control queue",\n            Some(RemoteControlSubcommand::Status { .. }) => "remote-control status",\n'
          assert old in s
          s = s.replace(old, new, 1)
          old = '    /// Create and print a short-lived manual pairing code.\n    Pair,\n}\n'
          new = '    /// Create and print a short-lived manual pairing code.\n    Pair,\n\n    /// Queue one user turn into an existing session.\n    Queue {\n        /// Canonical session/thread ID.\n        thread_id: String,\n        /// User message to queue.\n        message: String,\n        /// Optional stable client message ID for deduplication.\n        #[arg(long)]\n        client_user_message_id: Option<String>,\n    },\n\n    /// Inspect the runtime status of an existing session.\n    Status {\n        /// Canonical session/thread ID.\n        thread_id: String,\n    },\n}\n'
          assert old in s
          s = s.replace(old, new, 1)
          old = '        Some(RemoteControlSubcommand::Pair) => {\n            let output = codex_app_server_daemon::start_remote_control_pairing().await?;\n            print_remote_control_pairing_output(&output, command.json)?;\n        }\n'
          new = old + '        Some(RemoteControlSubcommand::Queue {\n            thread_id,\n            message,\n            client_user_message_id,\n        }) => {\n            let output = codex_app_server_daemon::queue_existing_session(ThreadQueueParams {\n                thread_id,\n                message,\n                client_user_message_id,\n            })\n            .await?;\n            if command.json {\n                println!("{}", serde_json::to_string(&output)?);\n            } else {\n                println!("Queued turn {} for session {}.", output.queue_id, output.thread_id);\n            }\n        }\n        Some(RemoteControlSubcommand::Status { thread_id }) => {\n            let output = codex_app_server_daemon::existing_session_status(ThreadStatusGetParams {\n                thread_id,\n            })\n            .await?;\n            if command.json {\n                println!("{}", serde_json::to_string(&output)?);\n            } else if output.state == ThreadRuntimeState::NotFound {\n                println!("Session {} was not found.", output.thread_id);\n            } else {\n                println!(\n                    "Session {}: {:?} (active_turn={}, queued={})",\n                    output.thread_id, output.state, output.active_turn, output.queued\n                );\n            }\n        }\n'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          cargo fmt --manifest-path codex-rs/Cargo.toml -- app-server-daemon/src/session_control_client.rs app-server-daemon/src/lib.rs cli/src/remote_control_cmd.rs
          cargo check --manifest-path codex-rs/Cargo.toml -p codex-app-server-daemon -p codex-cli
          cargo test --manifest-path codex-rs/Cargo.toml -p codex-app-server-daemon --lib
          rm .github/workflows/q3c-generator.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/app-server-daemon/src/session_control_client.rs codex-rs/app-server-daemon/src/lib.rs codex-rs/cli/src/remote_control_cmd.rs .github/workflows/q3c-generator.yml
          git commit -m 'Add existing-session queue and status CLI'
          git push origin HEAD:feature/queue-existing-session-cli
