name: q2-rtrb-security-baseline-generator

on:
  push:
    branches:
      - fix/q2-rtrb-security-baseline

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/q2-rtrb-security-baseline
          persist-credentials: true

      - uses: ./.github/actions/setup-ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Resolve patched rtrb on existing 0.3.x line
        working-directory: codex-rs
        run: cargo update -p rtrb --precise 0.3.5

      - name: Regenerate Bazel lock state
        run: just bazel-lock-update

      - name: Verify generator scope
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(codex-rs/Cargo.lock|MODULE.bazel.lock|\.github/workflows/q2-rtrb-security-baseline-generator\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected generated changes:"
            echo "$unexpected"
            exit 1
          fi
          grep -A3 '^name = "rtrb"$' codex-rs/Cargo.lock | grep 'version = "0.3.5"'

      - name: Commit generated lock repair and self-remove generator
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/q2-rtrb-security-baseline-generator.yml
          git add codex-rs/Cargo.lock MODULE.bazel.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: update rtrb security baseline"
          git push origin HEAD:fix/q2-rtrb-security-baseline
