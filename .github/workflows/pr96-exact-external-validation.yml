name: pr96-exact-external-validation

on:
  push:
    branches:
      - validate/94-pr96-exact

permissions:
  contents: read

jobs:
  python-controller:
    name: Controller Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e5e1112ef840b5286086b3a884fd87eaa4b9fd60
          persist-credentials: false
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "e5e1112ef840b5286086b3a884fd87eaa4b9fd60"
      - name: Compile controller scripts
        run: python3 -m py_compile .github/scripts/aren_*.py .github/scripts/test_aren_*.py
      - name: Run controller tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_aren_*.py'

  format-bench:
    name: Format and benchmark smoke
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e5e1112ef840b5286086b3a884fd87eaa4b9fd60
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - run: test "$(git rev-parse HEAD)" = "e5e1112ef840b5286086b3a884fd87eaa4b9fd60"
        working-directory: ..
      - run: cargo fmt -- --config imports_granularity=Item --check
      - run: just bench-smoke

  cargo-shear:
    name: Cargo dependency hygiene
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e5e1112ef840b5286086b3a884fd87eaa4b9fd60
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-shear@1.11.2
      - run: cargo shear --deny-warnings

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e5e1112ef840b5286086b3a884fd87eaa4b9fd60
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      - uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml
