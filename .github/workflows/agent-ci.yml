name: agent-ci

# Companion to `agent-exec.yml`: lets a shell-less worker produce real CI
# evidence on its own exact head.
#
# This exists because of a concrete stall. PR #96 sat for days with four
# commits and zero check runs: pushes made through the worker's GitHub
# connector do not schedule `pull_request` workflow runs, so the merge lane's
# first gate — green CI on the exact head — could never be satisfied. The
# worker cannot call the Actions dispatch API either, and `aren-ci`'s own
# `workflow_dispatch` trigger was therefore unreachable to it.
#
# A comment it *can* write reaches that trigger. `/agent-ci <branch>` dispatches
# the canonical blocking lane at that branch's head and reports the run back.
#
# `aren-ci` resolves its checkout to `github.sha` on a dispatch, which is the
# branch head, so the resulting checks attach to the exact commit under review.
# `ops/control-plane.md` states when that counts as merge-lane evidence.

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  issues: write

concurrency:
  group: agent-ci-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch the blocking lane
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.issue.labels.*.name, 'agent:exec') &&
      startsWith(github.event.comment.body, '/agent-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Acknowledge the request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes >/dev/null || true

      - name: Resolve the requested branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          branch="$(printf '%s' "${BODY}" | head -n 1 | awk '{print $2}')"
          if [[ -z "${branch}" ]]; then
            echo "::error::usage: /agent-ci <branch>"
            exit 1
          fi
          # A dispatch runs the lane from the named ref, so restrict the name to
          # a work branch with no room for option injection.
          if [[ ! "${branch}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,100}$ ]] || [[ "${branch}" == "main" ]]; then
            echo "::error::refusing branch name '${branch}'"
            exit 1
          fi
          sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/${branch}" --jq .object.sha)"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Dispatching aren-ci at ${branch} (${sha})"

      - name: Dispatch aren-ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${{ github.repository }}/actions/workflows/blocking-ci.yml/dispatches" \
            -f "ref=${{ steps.branch.outputs.branch }}"

      - name: Report the dispatched run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          SHA: ${{ steps.branch.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## agent-ci — \`${RESULT}\`"
            echo
            if [[ "${RESULT}" == "success" ]]; then
              echo "Dispatched \`aren-ci\` at \`${BRANCH}\` on exact head \`${SHA}\`."
              echo
              echo "Poll the check runs for that commit. A \`workflow_dispatch\`"
              echo "run on the exact head is valid merge-lane evidence; a run on"
              echo "any other commit is not."
              echo
              echo "Runs: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/blocking-ci.yml"
            else
              echo "No dispatch happened. See ${RUN_URL}."
            fi
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > comment.md
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -F body=@comment.md >/dev/null
